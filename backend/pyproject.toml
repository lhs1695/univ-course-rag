[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "univ-course-rag-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "argon2-cffi",
    "pydantic-settings",
    "python-multipart",
    "pymupdf",
    "python-pptx",
    "python-docx==1.2.0",
    "pgvector",
    "openai",
    "httpx==0.28.1",
    "semantic-text-splitter==0.33.0",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
docling = [
    "docling==2.140.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: optional live cloud API; skipped without key",
    "postgres: optional local Postgres integration; skipped unless explicitly enabled",
]

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic"]
