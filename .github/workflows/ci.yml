name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      EMBEDDER_BACKEND: fake
      LLM_BACKEND: fake
      DATABASE_URL: postgresql+psycopg://univ:univ@127.0.0.1:5432/univ_course_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check
      - name: Start pgvector
        run: docker compose up -d --wait postgres
      - name: Apply migrations and seed demo users
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app
      - name: Run Fake test suite
        run: pytest backend/tests
      - name: Prove pgvector retrieval
        env:
          RUN_POSTGRES_TESTS: "1"
        run: pytest backend/tests/test_retrieve.py -m postgres
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
